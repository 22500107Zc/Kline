name: Release

on:
  push:
    tags: ['v*']
    # Push a release/* branch to get installers as run artifacts without
    # cutting a tag; only tags publish an actual GitHub Release.
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: kiln-macos
          - os: windows-latest
            target: --win
            artifact: kiln-windows
          - os: ubuntu-latest
            target: --linux
            artifact: kiln-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds: skip notarisation rather than failing the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Download the build for your platform, then see the README for the
            first-run steps — these builds are unsigned, so macOS and Windows
            will ask for confirmation the first time you open Kiln.
