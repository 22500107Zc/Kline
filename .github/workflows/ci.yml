name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Smoke-test the desktop shell
        # Boots the real Electron app under a virtual display, screenshots it
        # and exits — proves the packaged shell renders, not just the web build.
        run: xvfb-run -a npx electron . --no-sandbox --enable-unsafe-swiftshader
        env:
          KILN_SMOKE: ${{ runner.temp }}/kiln-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-screenshot
          path: ${{ runner.temp }}/kiln-desktop.png
